name: build esphome modou

# 魔豆小车 ESPHome 语音助手固件在线编译
# 配置：esphome/modou.yaml（自研 external component：components/aw9106 背光 + components/zl38063 DSP）
# 密钥：编译前用 GitHub Secrets（WIFI_SSID/WIFI_PASSWORD）动态生成 esphome/secrets.yaml
# 版本：beta（2026.11.0b，2026-11-26 时点）——micro_wake_word 新增 prefer_internal_ram /
# ring_buffer_duration / task_core 三个性能选项均为 2026.11.0 引入，D0WD 双模型调优必需；
# 稳定版（2026.9.1）尚未包含。CI 编译兼做配置校验；若 beta 出问题，改回 "2026.8.2" 即回退。

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ESPHOME_VERSION: "beta"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # 0) 动态生成 secrets.yaml（写入 esphome/ 目录，docker 会把该目录挂载为 /config）
      - name: Generate secrets.yaml
        run: |
          cat > esphome/secrets.yaml <<EOF
          wifi_ssid: "${{ secrets.WIFI_SSID }}"
          wifi_password: "${{ secrets.WIFI_PASSWORD }}"
          EOF

      # 1) 编译（esphome 官方镜像自带 esp-idf 工具链；配置目录挂载为 /config）
      #    external_components 的 source: components 相对 modou.yaml 所在目录解析，
      #    仓库内 esphome/components/aw9106 会被自动发现，无需额外拷贝
      - name: Build ESPHome firmware
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/esphome:/config" \
            ghcr.io/esphome/esphome:${{ env.ESPHOME_VERSION }} \
            compile /config/modou.yaml

      # 2) 收集产物（注意：产物在 build/ 子目录下，且 OTA 载荷名为 firmware.ota.bin）
      #    *.factory.bin = 合并镜像（bootloader+分区表+app），USB 首烧用；
      #    firmware.ota.bin = OTA 升级载荷（ESPHome 网页升级 / esphome run 直接用）
      - name: Collect firmware
        run: |
          mkdir -p artifacts
          B="esphome/.esphome/build/modou-box/build"
          ls -la "$B"
          cp "$B"/firmware.factory.bin artifacts/esphome_modou_factory.bin 2>/dev/null || true
          cp "$B"/firmware.ota.bin artifacts/esphome_modou_ota.bin 2>/dev/null || true
          test -f artifacts/esphome_modou_factory.bin || test -f artifacts/esphome_modou_ota.bin \
            || { echo "no firmware output found!"; exit 1; }
          ls -la artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: esphome-modou
          path: artifacts/*
