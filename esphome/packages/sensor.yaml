# 传感器：电池电量 / 对话文本 / IP / API 连接状态（屏幕图标与对话页数据源）

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: IP Address
  - platform: template
    id: text_request    # 语音识别结果（VA on_stt_end 填充）
  - platform: template
    id: text_response   # 回复文本（VA on_tts_start 填充）

# API（Home Assistant）连接状态：屏幕右上角 HA 图标数据源
binary_sensor:
  - platform: status
    id: api_status
    internal: true

# ---- 电池电量（ADC1 CH0 / GPIO36 分压；电压-百分比锚点来自原厂 21 点表精简）----
sensor:
  - platform: adc
    pin: GPIO36
    id: battery_percent
    attenuation: 11db
    update_interval: 60s
    unit_of_measurement: "%"
    accuracy_decimals: 0
    filters:
      - multiply: 6.21   # 分压比（原厂 raw->mV 定点公式反推，待万用表实测校准）
      - calibrate_linear:
          - 4.185 -> 100.0
          - 3.949 -> 75.0
          - 3.773 -> 45.0
          - 3.605 -> 10.0
          - 3.400 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
