# 脚本：draw_display（页面调度核心）+ 唤醒词启停
# 写法对齐 lc-esp32s3：按 WiFi/API 连接状态 + VA 阶段切换页面

script:
  # 核心脚本：初始化中 → 加载页；WiFi 断 → 无WiFi页；HA 断 → 无HA页；
  # 其余按 va_phase 切换，默认 idle
  - id: draw_display
    then:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - if:
                      condition:
                        api.connected:
                      then:
                        - lambda: |-
                            switch (id(va_phase)) {
                              case ${voice_assist_listening_phase_id}:
                                id(modou_lcd).show_page(listening_page);
                                break;
                              case ${voice_assist_thinking_phase_id}:
                                id(modou_lcd).show_page(thinking_page);
                                break;
                              case ${voice_assist_replying_phase_id}:
                                id(modou_lcd).show_page(replying_page);
                                break;
                              case ${voice_assist_error_phase_id}:
                                id(modou_lcd).show_page(error_page);
                                break;
                              case ${voice_assist_muted_phase_id}:
                                id(modou_lcd).show_page(muted_page);
                                break;
                              case ${voice_assist_not_ready_phase_id}:
                                id(modou_lcd).show_page(no_ha_page);
                                break;
                              default:
                                id(modou_lcd).show_page(idle_page);
                                break;
                            }
                            id(modou_lcd).update();
                      else:
                        - display.page.show: no_ha_page
                        - component.update: modou_lcd
                else:
                  - display.page.show: no_wifi_page
                  - component.update: modou_lcd
          else:
            - display.page.show: initializing_page
            - component.update: modou_lcd

  # 启动设备端唤醒词（HA 已连接且 VA 空闲时才启动）
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - api.connected:
          then:
            - micro_wake_word.start:

  - id: stop_wake_word
    then:
      - micro_wake_word.stop:

  # 根据静音开关状态，把阶段设为空闲或静音（on_error/on_end 恢复时用）
  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(va_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(va_phase) = ${voice_assist_muted_phase_id};
      - script.execute: draw_display
