# 屏幕：ST7789 160x128，CUSTOM 模型重放原厂 18 条初始化序列
# 几何定案（对齐 mpy 板测结论 MADCTL=0xA0）：transform swap_xy+mirror_y = MV|MY = 0xA0
# 9 页面（lc-esp32s3 方案）：每页顶部共用状态行（DSP FAIL 优先 → IP → 电量/WiFi/HA 图标）
display:
  - platform: mipi_spi
    model: CUSTOM
    id: modou_lcd
    dimensions:
      width: 160
      height: 128
    transform:
      swap_xy: true
      mirror_x: false    # transform 三键必填
      mirror_y: true
    cs_pin: 27
    dc_pin: 21
    reset_pin: 22
    data_rate: 40MHz
    color_order: rgb
    invert_colors: false   # 0x21 已在 init_sequence 里，不再让驱动重复发
    update_interval: 1s    # 每秒重绘当前页（idle 时钟秒级跳动必需；160x128@40MHz 每帧约 8ms）
    init_sequence:
      - [0xC0, 0x00]
      - delay 20ms
      - [0xC2, 0x01, 0xFF]
      - [0xC3, 0x13]
      - [0xC4, 0x20]
      - [0xC6, 0x0F]
      - [0xCA, 0x0F]
      - [0xC8, 0x08]
      - [0x55, 0xB0]
      - [0x21, 0x00]        # INVON（原厂带参数写法，照抄）
      - [0xB1, 0x40, 0x02, 0x14]
      - [0x26, 0x01]        # GAMSET
      - [0x2A, 0x00, 0x00, 0x00, 0xEF]
      - [0x2B, 0x00, 0x00, 0x01, 0x3F]
      - [0x2C, 0x00]
      - [0xE0, 0xD0, 0x00, 0x05, 0x0E, 0x15, 0x0D, 0x37, 0x43, 0x47, 0x09, 0x15, 0x12, 0x16, 0x19]
      - [0xE1, 0xD0, 0x00, 0x05, 0x0D, 0x0C, 0x06, 0x2D, 0x44, 0x40, 0x0E, 0x1C, 0x18, 0x16, 0x19]
      - [0x11]              # SLPOUT
      - delay 120ms
      - [0x29]              # DISPON
      - delay 50ms
    pages:
      # ---- 初始化页 ----
      - id: initializing_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.printf(it.get_width() / 2, it.get_height() / 2, id(font_main), Color::WHITE,
                    TextAlign::CENTER, "加载中");
      # ---- 空闲页：时钟 + 日期星期 + 问候语 ----
      - id: idle_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          draw_top_status(it, id(icon_font), id(font_small), Color::WHITE,
                          id(battery_percent), id(ip_addr), id(api_status),
                          id(dsp).is_boot_ok());
          auto now = id(ha_time).now();
          if (!now.is_valid()) {
            it.printf(it.get_width() / 2, it.get_height() / 2, id(font_main), Color::WHITE,
                      TextAlign::CENTER, "等待时间同步");
            return;
          }
          // 大时钟（40px，居中）
          char hhmm[8];
          now.strftime(hhmm, sizeof(hhmm), "%H:%M");
          it.printf(it.get_width() / 2, 24, id(font_time), Color::WHITE,
                    TextAlign::CENTER, "%s", hhmm);
          // 日期 + 星期（中文）
          static const char *WEEKDAY_CN[] = {"周日", "周一", "周二", "周三", "周四", "周五", "周六"};
          char datebuf[24];
          now.strftime(datebuf, sizeof(datebuf), "%m月%d日");
          it.printf(it.get_width() / 2, 72, id(font_main), Color::WHITE, TextAlign::CENTER,
                    "%s %s", datebuf, WEEKDAY_CN[now.day_of_week - 1]);
          // 问候语（每分钟轮换一条）
          int idx = (int) ((millis() / 60000) % GREETINGS_COUNT);
          it.printf(it.get_width() / 2, 98, id(font_main), Color(0, 200, 255), TextAlign::CENTER,
                    "%s", GREETINGS[idx]);
      # ---- 聆听页 ----
      - id: listening_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          draw_top_status(it, id(icon_font), id(font_small), Color::WHITE,
                          id(battery_percent), id(ip_addr), id(api_status),
                          id(dsp).is_boot_ok());
          it.printf(it.get_width() / 2, it.get_height() / 2, id(font_main), Color::WHITE,
                    TextAlign::CENTER, "聆听中…");
      # ---- 思考页：识别文本 ----
      - id: thinking_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          draw_top_status(it, id(icon_font), id(font_small), Color::WHITE,
                          id(battery_percent), id(ip_addr), id(api_status),
                          id(dsp).is_boot_ok());
          it.printf(0, 20, id(font_main), Color(0, 200, 255), TextAlign::TOP_LEFT, "你问：");
          draw_wrapped(it, id(text_request).state.c_str(), id(font_cn), Color::WHITE,
                       0, 44, 160, 6, 14);
      # ---- 回复页：回复文本 ----
      - id: replying_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          draw_top_status(it, id(icon_font), id(font_small), Color::WHITE,
                          id(battery_percent), id(ip_addr), id(api_status),
                          id(dsp).is_boot_ok());
          it.printf(0, 20, id(font_main), Color(0, 200, 255), TextAlign::TOP_LEFT, "回复：");
          draw_wrapped(it, id(text_response).state.c_str(), id(font_cn), Color::WHITE,
                       0, 44, 160, 6, 14);
      # ---- 错误页 ----
      - id: error_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          draw_top_status(it, id(icon_font), id(font_small), Color::WHITE,
                          id(battery_percent), id(ip_addr), id(api_status),
                          id(dsp).is_boot_ok());
          it.printf(it.get_width() / 2, it.get_height() / 2, id(font_main), Color(255, 80, 80),
                    TextAlign::CENTER, "出错了");
      # ---- 静音页 ----
      - id: muted_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          draw_top_status(it, id(icon_font), id(font_small), Color::WHITE,
                          id(battery_percent), id(ip_addr), id(api_status),
                          id(dsp).is_boot_ok());
          it.printf(it.get_width() / 2, it.get_height() / 2, id(font_main), Color::WHITE,
                    TextAlign::CENTER, "静音");
      # ---- 未连接 HA 页 ----
      - id: no_ha_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          draw_top_status(it, id(icon_font), id(font_small), Color::WHITE,
                          id(battery_percent), id(ip_addr), id(api_status),
                          id(dsp).is_boot_ok());
          it.printf(it.get_width() / 2, it.get_height() / 2, id(font_main), Color::WHITE,
                    TextAlign::CENTER, "未连接HA");
      # ---- 未连接 WiFi 页 ----
      - id: no_wifi_page
        lambda: |-
          it.fill(Color(0, 0, 0));
          it.printf(it.get_width() / 2, it.get_height() / 2, id(font_main), Color::WHITE,
                    TextAlign::CENTER, "未连接wifi");
