---
# 魔豆小车 ESPHome 语音助手固件（v0.2：骨架 + 屏幕 + 背光）
#
# 硬件：ESP32-D0WD / 16MB Flash / 8MB PSRAM
# 屏：ST7789 风格 160x128 SPI（MOSI=33 SCLK=32 CS=27 DC=21 RST=22，40MHz，反转色）
# LCD 电源/背光挂在 AW9106（I2C 0x5b，SDA=18 SCL=23）上：
#   初始化顺序必须是 AW9106 -> LCD SPI（esp32 板实测结论）
#
# 参考：esphome-box-3（S3 Box 3 官方语音助手配置汉化版）
# 烧录：USB 首烧；之后走 OTA

substitutions:
  name: modou-box
  friendly_name: MoDu Box

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 40MHz

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

# ---- I2C（AW9106 专用；v0.3 起 DSP 不走 I2C）----
i2c:
  - id: i2c_bus
    sda: 18
    scl: 23
    frequency: 100kHz

# ---- 自研组件：AW9106（LCD 电源/背光，开机最先初始化）----
external_components:
  - source: components
    components: [aw9106]

aw9106:
  id: aw9106_hub
  backlight:
    name: Screen Backlight
    restore_mode: ALWAYS_ON

# ---- SPI2（与 DSP HBI 共享总线；v0.3 加 DSP 设备）----
spi:
  - id: spi_bus
    clk_pin: 32
    mosi_pin: 33
    miso_pin: 34

# ---- 屏幕：ST7789 160x128，CUSTOM 模型重放原厂 18 条初始化序列 ----
# rotation 对应原厂 MADCTL=0xA0（MY+MV）；板上若画面旋转 180 度改 90°
# 板上若画面整体偏移，调 dimensions 的 offset_width/offset_height
display:
  - platform: mipi_spi
    model: CUSTOM
    id: modou_lcd
    dimensions: 160x128
    cs_pin: 27
    dc_pin: 21
    reset_pin: 22
    data_rate: 40MHz
    color_order: rgb
    invert_colors: false   # 0x21 已在 init_sequence 里，不再让驱动重复发
    rotation: 270°
    init_sequence:
      - [0xC0, 0x00]
      - delay 20ms
      - [0xC2, 0x01, 0xFF]
      - [0xC3, 0x13]
      - [0xC4, 0x20]
      - [0xC6, 0x0F]
      - [0xCA, 0x0F]
      - [0xC8, 0x08]
      - [0x55, 0xB0]
      - [0x21, 0x00]        # INVON（原厂带参数写法，照抄）
      - [0xB1, 0x40, 0x02, 0x14]
      - [0x26, 0x01]        # GAMSET
      - [0x2A, 0x00, 0x00, 0x00, 0xEF]
      - [0x2B, 0x00, 0x00, 0x01, 0x3F]
      - [0x2C, 0x00]
      - [0xE0, 0xD0, 0x00, 0x05, 0x0E, 0x15, 0x0D, 0x37, 0x43, 0x47, 0x09, 0x15, 0x12, 0x16, 0x19]
      - [0xE1, 0xD0, 0x00, 0x05, 0x0D, 0x0C, 0x06, 0x2D, 0x44, 0x40, 0x0E, 0x1C, 0x18, 0x16, 0x19]
      - [0x11]              # SLPOUT
      - delay 120ms
      - [0x29]              # DISPON
      - delay 50ms
    lambda: |-
      // v0.2 测试图案：四色块（对应 test_screen.py，直观判断方向/偏移）
      it.fill(Color::BLACK);
      it.filled_rectangle(0, 0, 80, 64, Color(255, 0, 0));    // 红
      it.filled_rectangle(80, 0, 80, 64, Color(0, 255, 0));   // 绿
      it.filled_rectangle(0, 64, 80, 64, Color(0, 0, 255));   // 蓝
      it.filled_rectangle(80, 64, 80, 64, Color::WHITE);
