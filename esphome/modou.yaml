---
# 魔豆小车 ESPHome 语音助手固件（v0.5：多页面显示 + 配置包化）
#
# 硬件：ESP32-D0WD / 16MB Flash / 8MB PSRAM
# 屏：ST7789 160x128 SPI（MOSI=33 SCLK=32 CS=27 DC=21 RST=22，40MHz，反转色）
# DSP：ZL38063 HBI over SPI2（CS=GPIO0，RST=GPIO19），开机自动 boot（固件 blob 内嵌）
# I2S：BCK=5 WS=25 DIN=35 DOUT=26，16bit（DSP 为 I2S slave，ESP32 出时钟）
#      mic 16kHz（板上实测 DSP 可从机同步）+ speaker 48kHz，同总线分时复用
# 键：GPIO38（按下拉低，外部上拉）→ 一按即说（push-to-talk）
# 初始化顺序（板上实测结论）：AW9106 上电 → LCD SPI → DSP boot
#
# 唤醒词：设备端 mWW（okay_nabu + 自研"魔豆"模型）；识别/TTS 经 api 交给 HA assist
# 屏幕：9 页面（packages/display.yaml），事件驱动切换（script.yaml draw_display）
# 烧录：USB 首烧（factory.bin）；之后 OTA（见方案文档第六章 OTA 纪律）

substitutions:
  name: modou-box
  friendly_name: MoDu Box

  # ---- 语音助手阶段 ID ----
  voice_assist_idle_phase_id: "1"          # 空闲
  voice_assist_listening_phase_id: "2"     # 聆听
  voice_assist_thinking_phase_id: "3"      # 思考
  voice_assist_replying_phase_id: "4"      # 回复
  voice_assist_not_ready_phase_id: "10"    # 未连接 HA
  voice_assist_error_phase_id: "11"        # 错误
  voice_assist_muted_phase_id: "12"        # 静音

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  # 屏幕辅助绘制函数（display_helpers.h：问候语/电池图标行/文本换行）
  # 注意：esphome.includes 是逐个拷贝到构建目录的（只拷这里列出的文件）
  includes:
    - display_helpers.h
  on_boot:
    priority: 600
    then:
      - script.execute: draw_display
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: draw_display

esp32:
  board: esp32dev
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF   # 默认 SIZE 侧重体积；PERF 提升运行速度（体积换性能，16MB 富余）

psram:
  mode: quad
  speed: 40MHz

logger:
  level: DEBUG
  baud_rate: 115200   # UART0(GPIO1/3) 串口日志，参数与 mpy 时代一致

api:

ota:
  - platform: esphome
    id: ota_esphome
  - platform: web_server   # 2025.7 起网页 OTA 必须显式声明（breaking change）
    id: ota_web

web_server:
  port: 80                 # 网页 OTA 上传页 + 实体控制（无日志页，日志走串口/esphome logs）

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display

captive_portal:

# ---- 全局：VA 阶段（页面调度用）+ 初始化标记 ----
# 1=待机 2=聆听 3=思考 4=应答 10=未连接 11=错误 12=静音
globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: va_phase
    type: int
    restore_value: false
    initial_value: ${voice_assist_not_ready_phase_id}

# ---- 自研组件（aw9106 / zl38063，source 相对本文件解析）----
external_components:
  - source: components
    components: [aw9106, zl38063]

# ---- 配置包 ----
packages:
  hardware: !include packages/hardware.yaml    # I2C/SPI/AW9106/ZL38063/I2S
  fonts: !include packages/fonts.yaml          # 字体（含 MDI 图标）
  time: !include packages/time.yaml            # HA 时间源
  sensor: !include packages/sensor.yaml        # 电池/文本/IP/API 状态
  script: !include packages/script.yaml        # draw_display 等脚本
  display: !include packages/display.yaml      # 9 页面
  voice: !include packages/voice.yaml          # mWW/VA/媒体播放器/PTT
